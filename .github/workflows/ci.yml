name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - checkpoint/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate SEO
        run: npm run validate:seo

      - name: Test launch environment gate
        run: npm run test:launch-env

      - name: Test Preview release policy
        run: npm run test:preview-release

      - name: Test inquiry privacy and abuse boundaries
        run: npm run test:inquiries

      - name: Test booking catalog and Cal.com discovery boundaries
        run: npm run test:booking

      - name: Test accessibility markup boundaries
        run: npm run test:accessibility

      - name: Test commerce reconciliation policy
        run: npm run test:commerce

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Compile production application
        # Deployment builds use `npm run build`, which requires the complete
        # environment-specific provider gate. CI has no provider secrets, so it
        # tests that gate with synthetic fixtures above and compiles separately.
        run: npm run build:ci
